[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quintic-motion-designer"
version = "0.1.0"
description = "A Windows desktop tool for designing C2-continuous quintic motion profiles."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Quintic Motion Designer contributors" }]
keywords = ["motion-profile", "quintic-polynomial", "trajectory", "tkinter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "black>=24.10",
    "ruff>=0.9",
]
build = [
    "pyinstaller>=6.11",
]

[project.gui-scripts]
quintic-motion-designer = "desktop_app:main"

[tool.setuptools]
py-modules = [
    "chart_renderer",
    "desktop_app",
    "motion_project",
    "quintic_profile",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
