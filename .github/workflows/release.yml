name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $Version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ("v$Version" -ne "${{ github.ref_name }}") {
              throw "Tag ${{ github.ref_name }} does not match pyproject.toml version v$Version"
          }

      - name: Install project, quality tools, and builder
        run: python -m pip install -e ".[dev,build]"

      - name: Verify source
        shell: pwsh
        run: |
          ruff check .
          black --check .
          python -m unittest discover -s tests -v

      - name: Build Windows client
        shell: pwsh
        run: .\scripts\build_windows.ps1 -SkipInstall

      - name: Create release archive and checksum
        shell: pwsh
        run: .\scripts\package_release.ps1 -Version "${{ github.ref_name }}"

      - name: Preserve workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuinticMotionDesigner-${{ github.ref_name }}-Windows-x64
          path: .artifacts/release/*
          retention-days: 90
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Assets = Get-ChildItem .artifacts\release\* | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" @Assets --generate-notes --title "Quintic Motion Designer ${{ github.ref_name }}"
